*{box-sizing:border-box;margin:0}html{background:#030303}html,body{overflow-x:hidden}
body{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#030303;color:#f3f3f3;-webkit-text-size-adjust:100%;min-height:100vh}

.scr{animation:in .45s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(16px)}}

.btn:active{transform:scale(.98)}.btn:disabled{opacity:.3;cursor:default}

.rack{display:flex;justify-content:center;gap:4px;align-items:flex-start;margin:30px 0 10px}
.rack .col{display:flex;flex-direction:column;align-items:center;gap:8px}.rack .col{flex:1 1 0;min-width:0}.rack .col span,.mini .col span,.dose small{white-space:nowrap;letter-spacing:-.01em}.rack .col span{font-size:clamp(8.5px,2.5vw,11px);color:#aaa;text-align:center;line-height:1.25}.rack .col b{font-size:19px;letter-spacing:-.02em}

 background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);transition:background .2s,color .2s,transform .15s}

.opt.on{background:#fff;color:#000;border-color:#fff}.opt.on .l{background:#000;color:#fff;border-color:#000}

.tabs{display:flex;gap:6px;margin:14px 0 6px;padding:4px;border-radius:16px}.tabs button{flex:1;padding:11px 6px;border-radius:12px;border:0;background:none;font-size:14px;font-weight:600;color:#bbb}.tabs button.on{background:#fff;color:#000}

.steps li::before{content:counter(s);font-weight:700;color:#8d8d8d}.steps li i{font-style:normal;color:#8d8d8d;font-size:13px;white-space:nowrap}.steps small{display:block;color:#9a9a9a;font-size:13px}

.home b{font-size:15px;display:block;line-height:1.3}.home span{font-size:13px;color:#9a9a9a;line-height:1.4;display:block;margin-top:2px}

.tag{display:inline-block;margin-top:16px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:600}

.toast.on{opacity:1;transform:translate(-50%,0)}
footer{position:relative;z-index:1;text-align:center;color:#666;font-size:13px;padding:10px 22px calc(30px + env(safe-area-inset-bottom));line-height:1.6}footer a{color:#aaa}
body.q footer{display:none}body.q main{padding:12px 0 16px}body.q .glow{opacity:.25}
